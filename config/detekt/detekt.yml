build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true

complexity:
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 10

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
      - 'Preview'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    excludes:
      - '**/*Theme.kt'
      - '**/*Style.kt'
      - '**/*Defaults.kt'
      - '**/*Preview.kt'
      - '**/sample/**'
      - '**/test/**'
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'

